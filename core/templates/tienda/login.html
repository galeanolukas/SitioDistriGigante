{% extends 'tienda/base.html' %}
{% block title %}Acceso — GIGANTE Distribuidora{% endblock %}

{% block content %}
<div class="confirmado-wrap">
    <div class="form-card text-start mt-4">
        <div class="text-center mb-3">
            <i class="bi bi-person-circle" style="font-size:3rem;color:#fff"></i>
            <h1 class="seccion-titulo d-inline-block border-0 ps-0 mt-2">Acceso</h1>
            <p class="text-muted small mb-0">Ingresá con tu usuario para gestionar pedidos.</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" required autofocus
                       autocomplete="username" placeholder="Tu nombre de usuario">
            </div>
            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" required
                       autocomplete="current-password" placeholder="••••••••">
            </div>
            <button type="submit" class="btn-cta mt-0">
                <i class="bi bi-box-arrow-in-right"></i> Ingresar
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="{% url 'reset_pass' %}" class="btn-secundario">Olvidé mi contraseña</a>
        </div>
    </div>
</div>
{% endblock %}
